<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<title>Quản lý xe</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --plate:#F7C948;
  --plate-edge:#12141A;
  --ink:#14161A;
  --ink-2:#4A4F58;
  --ink-3:#868D98;
  --bg:#E9EBEC;
  --card:#FFFFFF;
  --line:#D5D8DC;
  --ok:#1F8A4C;
  --warn:#E0900B;
  --bad:#D93B30;
  --r:14px;
  --pad:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --sidebar:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(72px + var(--safe-b));
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- App bar ---------- */
.bar{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--pad) 12px;
  display:flex;align-items:center;gap:10px;
}
.bar h1{
  margin:0;font-family:'Oswald',sans-serif;font-weight:600;
  font-size:17px;letter-spacing:.08em;text-transform:uppercase;flex:1;
}
.bar .sub{font-size:11px;color:#8D949E;letter-spacing:.04em;font-family:'Be Vietnam Pro',sans-serif;text-transform:none;display:block}
.iconbtn{color:#fff;font-size:19px;padding:6px 9px;border-radius:9px;position:relative;line-height:1}
.iconbtn:active{background:#2A2E36}
.dot{
  position:absolute;top:1px;right:1px;min-width:17px;height:17px;padding:0 4px;
  background:var(--bad);color:#fff;border-radius:99px;
  font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- Search ---------- */
.search{padding:12px var(--pad) 4px;display:flex;gap:8px}
.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px var(--pad);scrollbar-width:none;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chiplb{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);align-self:center;padding-right:3px;flex:0 0 auto}
.drive{display:flex;align-items:center;gap:11px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.drive:last-child{border-bottom:none}
.drive:hover{background:#F4F5F6}
.drive .dic{width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.drive .dtx{flex:1;min-width:0}
.drive .dtx b{display:block;font-size:13.5px;font-weight:600}
.drive .dtx span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Biển số ---------- */
.plate{display:inline-flex;align-items:center;justify-content:center;background:var(--plate);border:2px solid var(--plate-edge);border-radius:6px;padding:5px 11px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.plate span{font-family:'Oswald',sans-serif;font-weight:700;color:var(--plate-edge);letter-spacing:.05em;font-size:19px;line-height:1.1;white-space:nowrap}
.plate.sm span{font-size:15px}
.plate.lg span{font-size:26px}
.plate.trang{background:#FFFFFF}
.plate.trang span{color:#12141A}

/* ---------- Tem ---------- */
.tem{width:50px;height:50px;border-radius:50%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;line-height:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.tem b{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700}
.tem i{font-style:normal;font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.92;margin-top:2px}
.tem.ok{background:var(--ok)} .tem.warn{background:var(--warn)} .tem.bad{background:var(--bad)} .tem.none{background:var(--ink-3)}
.tem.sm{width:38px;height:38px} .tem.sm b{font-size:13px} .tem.sm i{font-size:6.5px}

/* ---------- Pills giấy tờ ---------- */
.pills{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:6px;letter-spacing:.03em}
.pill.ok{background:#E4F3EA;color:#166B3B} .pill.warn{background:#FBF0D8;color:#8A5B06}
.pill.bad{background:#FBE4E2;color:#96291F} .pill.none{background:#E9EBEC;color:#7A818B}

/* ---------- Cards ---------- */
.list{padding:4px var(--pad) 20px;display:flex;flex-direction:column;gap:11px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.vcard{display:flex;gap:12px;padding:13px;align-items:center;width:100%;text-align:left}
.vcard:hover{background:#F4F5F6}
.vthumb{width:62px;height:62px;border-radius:10px;flex:0 0 auto;background:#DDE0E3 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;color:#9AA1AA;font-size:11px;letter-spacing:.06em}
.vmain{flex:1;min-width:0}
.vname{font-weight:600;font-size:15px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta{font-size:12px;color:var(--ink-3);margin-top:1px}

/* ---------- Detail ---------- */
.hero{background:var(--ink);color:#fff;padding:18px var(--pad) 20px}
.hero .row{display:flex;align-items:center;gap:14px}
.hero .nm{font-size:19px;font-weight:600;margin-top:10px}
.hero .mt{font-size:12.5px;color:#9AA1AA;margin-top:2px}
.tabs{display:flex;background:var(--ink);padding:0 var(--pad);gap:22px;position:sticky;top:0;z-index:30}
.tab{color:#8D949E;padding:13px 0 11px;font-size:13px;font-weight:500;border-bottom:2.5px solid transparent;letter-spacing:.02em}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--plate)}

.sec{padding:16px var(--pad) 8px}
.sec h3{font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv .r{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.kv .r:last-child{border-bottom:none}
.kv .k{color:var(--ink-2);font-size:13.5px;flex:0 0 auto}
.kv .v{text-align:right;font-weight:500;font-size:14px;min-width:0;word-break:break-word}
.kv .v.mono{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:400}
.kv .v.num{font-family:'Oswald',sans-serif;font-weight:600;font-size:15.5px}
.v.pos{color:var(--ok)} .v.neg{color:var(--bad)} .v.wr{color:var(--warn)}

/* ---------- Rows ---------- */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:#F4F5F6}
.mtag{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--ink-2);flex:0 0 auto;text-align:center;line-height:1.15}
.mtag b{display:block;font-size:15px;color:var(--ink)}

/* ---------- Dashboard ---------- */
.revrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.revrow:last-child{border-bottom:none}
.rvname{flex:1;min-width:0}
.rvname>span:last-child{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.revin{width:132px;flex:0 0 auto;text-align:right;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14.5px;
  font-family:'Oswald',sans-serif;font-weight:600}
.revin:focus{outline:2px solid var(--ink);outline-offset:-1px;background:var(--card)}
.revin.saving{opacity:.5}
.revin.saved{border-color:var(--ok);background:#E4F3EA}
@media (min-width:900px){.revin{width:170px}}
.mpick{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px}
.mpick span{flex:1;text-align:center;font-size:13.5px;color:var(--ink-2)}
.mpick span b{font-family:'Oswald',sans-serif;font-size:16px;color:var(--ink);font-weight:600}
.mpick button{width:38px;height:38px;border-radius:9px;font-size:20px;color:var(--ink-2)}
.mpick button:hover{background:var(--bg)}
.mpick button[disabled]{opacity:.3;cursor:default}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .lb{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:'Oswald',sans-serif}
.stat .vl{font-family:'Oswald',sans-serif;font-size:25px;font-weight:600;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ---------- Form ---------- */
.f{padding:14px var(--pad)}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px}
.dateinp.bad{border-color:var(--bad);background:#FDF2F1}
.fg .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.fg textarea{resize:vertical;min-height:66px;font-family:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.plchoose{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.plopt{display:block;text-align:center;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 8px;cursor:pointer}
.plopt input{position:absolute;opacity:0;pointer-events:none}
.plopt .plate{margin-bottom:8px}
.plopt b{display:block;font-size:13px;font-weight:600}
.plopt i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.plopt:has(input:checked){border-color:var(--ink);background:#F4F5F6;box-shadow:0 0 0 1px var(--ink)}
.cbx{display:flex;align-items:center;gap:9px;padding:9px 0 4px;font-size:13px;color:var(--ink-2);cursor:pointer}
.cbx input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--ink);margin:0}
.fhead{font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:24px 0 10px;padding-top:14px;border-top:1px solid var(--line)}

.btn{display:block;width:100%;background:var(--ink);color:#fff;border-radius:11px;padding:14px;font-weight:600;font-size:15px;text-align:center}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}

/* ---------- Photos ---------- */
.ph{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ph a{display:block;aspect-ratio:4/3;border-radius:11px;overflow:hidden;background:#DDE0E3;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .dead{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-3);font-size:11.5px;text-align:center;padding:8px}

/* ---------- Nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
.nav .brand{display:none}
.mark{height:30px;width:auto;flex:0 0 auto;display:block}
.bar .mark{height:34px;margin-right:6px}
.nav button{flex:1;padding:9px 0 8px;color:var(--ink-3);font-size:10.5px;letter-spacing:.03em;position:relative}
.nav button .ic{display:block;font-size:19px;margin-bottom:1px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}

.paybar{
  margin:12px var(--pad) 0;background:var(--ink);color:#fff;
  border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;
  width:calc(100% - var(--pad)*2);text-align:left;
}
.paybar:hover{opacity:.93}
.paybar .lb{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8D949E}
.paybar .vl{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;margin-top:2px;color:var(--plate)}
.paybar .sb{font-size:11.5px;color:#9AA1AA;margin-top:2px}
@media (min-width:900px){.paybar{max-width:1120px;margin:14px auto 0}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lgbox{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:32px 26px;max-width:380px;width:100%;text-align:center}
.lgbox .mark{height:34px;margin:0 auto 20px}
.lgbox h2{font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.08em;
  text-transform:uppercase;margin:0 0 6px}
.lgbox p{font-size:13.5px;color:var(--ink-3);margin:0 0 22px}
.lgbox .btn{max-width:none}
.empty{text-align:center;padding:56px 28px;color:var(--ink-3)}
.empty .ic{font-size:40px;opacity:.35}
.empty p{margin:10px 0 18px;font-size:14px}
.banner{border-radius:11px;padding:10px 13px;font-size:12.5px;margin:12px var(--pad) 0;background:#FFF6D9;border:1px solid #EFD98A;color:#6B5410}
.banner.red{background:#FDE8E6;border-color:#F1B5AF;color:#8A2A22}
.banner button{text-decoration:underline;font-weight:600;color:inherit}

.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-bottom:40px}
#upbar{
  position:fixed;left:12px;right:12px;z-index:70;
  bottom:calc(78px + var(--safe-b));
  background:var(--ink);color:#fff;border-radius:13px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}
#upbar .t{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
#upbar .t b{display:block;font-weight:600}
#upbar .t span{font-size:11.5px;color:#9AA1AA}
#upbar button{background:var(--plate);color:#12141A;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:9px;flex:0 0 auto}
#upbar .later{background:none;color:#9AA1AA;font-weight:400;padding:9px 4px}
@media (min-width:900px){
  #upbar{left:auto;right:24px;bottom:24px;max-width:400px}
}

/* =========================================================
   DESKTOP  ≥900px
   ========================================================= */
@media (min-width:900px){
  :root{--sidebar:224px;--pad:24px}
  body{padding-bottom:0}
  .nav{
    top:0;bottom:0;right:auto;width:var(--sidebar);
    flex-direction:column;align-items:stretch;
    border-top:none;border-right:1px solid var(--line);
    padding:20px 12px;gap:4px;
  }
  .nav .brand{display:block;padding:4px 10px 22px}
  .nav .brand .mark{height:38px}
  .nav button{
    flex:0 0 auto;display:flex;align-items:center;gap:11px;
    padding:11px 12px;border-radius:10px;font-size:14px;text-align:left;
  }
  .nav button .ic{margin:0;font-size:17px}
  .nav button:hover{background:var(--bg)}
  .nav button[aria-current="page"]{background:var(--ink);color:#fff}
  #app{margin-left:var(--sidebar)}
  .bar{padding:18px var(--pad) 16px}
  .bar h1{font-size:19px}
  .inner{max-width:1120px;margin:0 auto}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:8px var(--pad) 32px;max-width:1120px;margin:0 auto}
  .secs{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start;max-width:1120px;margin:0 auto}
  .secs .full{grid-column:1/-1}
  .hero{padding:26px var(--pad) 28px}
  .tabs{padding:0 var(--pad);gap:28px}
  .grid2{grid-template-columns:repeat(4,1fr)}
  .f{max-width:720px;margin:0 auto;padding:20px var(--pad) 40px}
  .btn{max-width:320px}
  .ph{grid-template-columns:repeat(3,1fr)}
  .chips{flex-wrap:wrap;max-width:1120px;margin:0 auto}
  .search{max-width:1120px;margin:0 auto}
  .sheet{padding-left:var(--sidebar)}
  .sheet .f{max-width:600px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hide{display:none!important}
</style>
</head>

</nav>

/* Ô nhập ngày kiểu Việt Nam. Ô <input type="date"> của trình duyệt
   hiện theo ngôn ngữ máy (máy tiếng Anh ra mm/dd), nên tự làm cho chắc. */
function toISO(v){
  const m = String(v||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return "";
  const d = +m[1], mo = +m[2], y = +m[3];
  const dt = new Date(y, mo-1, d);
  if(dt.getDate()!==d || dt.getMonth()!==mo-1 || dt.getFullYear()!==y) return "";
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
const toVN = iso => {
  const m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : "";
};

}

      const d = i.value.replace(/\D/g,"").slice(0,8);
      let out = d.slice(0,2);
      if(d.length > 2) out += "/" + d.slice(2,4);
      if(d.length > 4) out += "/" + d.slice(4,8);
      if(!xoa && (d.length === 2 || d.length === 4)) out += "/";
      i.value = out;
      i.classList.toggle("bad", i.value.length === 10 && !toISO(i.value));
    });
  });
}

function docState(d){
  if(d===null) return { cls:"none", big:"—", small:"chưa có" };
  if(d < 0)    return { cls:"bad",  big:Math.abs(d), small:"quá hạn" };
  if(d <= WARN_DAYS) return { cls:"warn", big:d, small:"ngày" };

}

function missingInfo(v){
  const out = [];
  for(const D of DOCS)
    if(!naDoc(v,D.key) && !v[D.key]) out.push(`Hạn ${D.label.toLowerCase()}`);

/* Giấy tờ gấp nhất của 1 xe */
function urgent(v){
  let best = null;
  for(const D of DOCS){
    if(naDoc(v,D.key)) continue;
    const d = daysLeft(v[D.key]);
    if(d===null) continue;
    if(!best || d < best.d) best = { d, doc:D };
  }
  if(!best) return { cls:"none", big:"—", small:"chưa có", d:null, doc:null };
  return { ...docState(best.d), d:best.d, doc:best.doc, small:best.doc.tag };
}
/* Toàn bộ cảnh báo trong đội xe */
function allAlerts(){
  const out = [];
  for(const v of VEHICLES) for(const D of DOCS){
    if(naDoc(v,D.key)) continue;
    const d = daysLeft(v[D.key]);
    if(d!==null && d<=WARN_DAYS) out.push({ v, doc:D, d });
  }
  return out.sort((a,b)=>a.d-b.d);
}
/* Link Google Drive → ID → URL hiện được trong <img> */
function driveId(u){
  const s = String(u||"");
  if(/\/folders\//.test(s)) return null;                 // link thư mục, không phải ảnh
  const m = s.match(/\/file\/d\/([\w-]{20,})/)
         || s.match(/[?&]id=([\w-]{20,})/)
         || s.match(/\/d\/([\w-]{20,})/);
  return m ? m[1] : null;
}
function imgSrc(u, w=1000){
  const id = driveId(u);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : u;
}
const isFolder = u => /\/folders\//.test(String(u||""));
/* Biển vàng = xe kinh doanh vận tải, biển trắng = xe cá nhân */

function notifyState(){
  if(!("Notification" in window)) return "unsupported";
  return Notification.permission;               // granted | denied | default
}
async function askNotify(){
  if(!("Notification" in window)) return alert("Trình duyệt này không hỗ trợ thông báo.");
  const p = await Notification.requestPermission();
  if(p==="granted"){ fireNotify(true); render(); }
  else if(p==="denied") alert("Ông đã chặn thông báo. Mở lại trong cài đặt trình duyệt cho trang này.");
}
async function showNoti(title, opts){
  // Chrome trên Android CHẶN new Notification() trong PWA,
  // bắt buộc đi qua service worker. Ưu tiên SW, không có mới fallback.
  try{
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.ready;
      if(reg && reg.showNotification) return reg.showNotification(title, opts);
    }
  }catch{}
  try{ new Notification(title, opts); }catch(e){ console.warn("Không bật được thông báo:", e); }
}

async function fireNotify(force=false){
  if(notifyState()!=="granted") return;
  const list = allAlerts();
  const miss = allMissing();
  if(!list.length && !miss.length) return;
  const today = new Date().toISOString().slice(0,10);
  if(!force && store.get("qlx_notified")===today) return;   // mỗi ngày 1 lần
  store.set("qlx_notified", today);
  const qh = list.filter(a=>a.d<0).length;
  let body = list.slice(0,4)
    .map(a=>`${a.v.id} — ${a.doc.label} ${a.d<0?`quá hạn ${Math.abs(a.d)} ngày`:`còn ${a.d} ngày`}`)
    .join("\n") + (list.length>4 ? `\n…và ${list.length-4} mục nữa` : "");
  if(miss.length) body += `${body?"\n":""}${miss.length} xe còn thiếu thông tin`;
  await showNoti(
    qh ? `${list.length} giấy tờ cần xử lý — ${qh} đã quá hạn`
       : list.length ? `${list.length} giấy tờ sắp hết hạn`
       : `${miss.length} xe thiếu thông tin`,
    { body, tag:"qlx-alert", icon:"icon-192.png", badge:"icon-192.png", renotify:true }
  );
}

  const qi = document.getElementById("q");

  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ FILTER=b.dataset.f; renderList(); });
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>go("detail", b.dataset.v));
  app.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>go(b.dataset.go2));

}

function docPills(v){
  const extra = missingInfo(v).length;
  return `<div class="pills">${DOCS.map(D=>{
    if(naDoc(v,D.key)) return `<span class="pill none" style="opacity:.5">${D.tag} —</span>`;
    const s = docState(daysLeft(v[D.key]));
    const txt = s.cls==="none" ? "thiếu" : s.cls==="bad" ? `quá ${s.big}n` : `${s.big}n`;
    return `<span class="pill ${s.cls}">${D.tag} ${txt}</span>`;
  }).join("")}${extra?`<span class="pill none">⚠ thiếu ${extra}</span>`:""}</div>`;
}
function vCard(v){
  const t = urgent(v), img = firstImg(v);

function shiftMonth(id, delta){
  const [y,m] = id.split("-").map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

/* =========================================================
   ĐĂNG NHẬP GOOGLE
   Chỉ email có sẵn trong collection nhanVien mới vào được.
   ========================================================= */
async function dangNhap(){
  const prov = new FA.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  try{
    await FA.signInWithPopup(AUTH, prov);
  }catch(err){
    const c = String(err?.code||"");
    if(c.includes("popup-blocked") || c.includes("popup-closed") ||
       c.includes("operation-not-supported") || c.includes("cancelled-popup")){
      return FA.signInWithRedirect(AUTH, prov);   // PWA trên iOS hay chặn popup
    }
    if(c.includes("unauthorized-domain"))
      return alert("Tên miền này chưa được cho phép.\n\nFirebase Console → Authentication → " +
                   "Settings → Authorized domains → thêm " + location.hostname);
    alert("Không đăng nhập được.\n\n" + (err?.message || c));
  }
}
async function dangXuat(){
  try{ await FA.signOut(AUTH); }catch{}
  ME = null; VEHICLES = []; MONTHLY = {}; EXPENSES = {}; SHEETS = [];
  manDangNhap();
}

  if(nx && !nx.disabled) nx.onclick = ()=>{ REV_M = shiftMonth(M,1); renderRev(); };

  // nhập tới đâu lưu tới đó
  app.querySelectorAll(".revin").forEach(inp=>{
    inp.onchange = async ()=>{
      const val = inp.value === "" ? null : +inp.value;
      inp.classList.add("saving");
      try{
        await saveMonth(inp.dataset.v, { id:M, doanhThu: val===null ? 0 : val });
        inp.classList.remove("saving"); inp.classList.add("saved");
        setTimeout(()=>inp.classList.remove("saved"), 1200);
        capNhatTong();
      }catch(e){
        inp.classList.remove("saving");
        alert(loiFirestore(e));
      }
    };
  });

  function capNhatTong(){
    const t = [...app.querySelectorAll(".revin")].reduce((s,i)=>s+(+i.value||0),0);
    const el = app.querySelector(".stat .vl");
    if(el) el.textContent = money(t) + " đ";
  }

  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const i = +b.dataset.del;
    if(!confirm(`Xoá link "${SHEETS[i].ten}"?`)) return;
    SHEETS.splice(i,1); await saveSheets(); renderRev();
  });
  const add = document.getElementById("addSheet");
  if(add) add.onclick = sheetForm;
  wireBell();
}

  const areas = [...new Set(VEHICLES.map(v=>v.khuVuc).filter(Boolean))].sort();

    </div>`;

    const url = el.querySelector("#stUrl").value.trim();
    if(!ten || !url) return alert("Nhập đủ tên và đường dẫn.");
    if(!/^https?:\/\//i.test(url)) return alert("Đường dẫn phải bắt đầu bằng https://");

/* ---- Chi phí hàng tháng ---- */
let EXP_M = null;

  const laMoiNhat = M >= thisMonth();

  const items = (await loadExpenses(M)).slice()
    .sort((a,b)=>(b.ngay||"").localeCompare(a.ngay||"") || (+b.soTien||0)-(+a.soTien||0));
  const tong = items.reduce((s,e)=>s+(+e.soTien||0), 0);

  // gộp theo hạng mục
  const hm = {};
  for(const e of items){
    const k = e.hangMuc || "Chưa đặt tên";
    hm[k] = (hm[k]||0) + (+e.soTien||0);
  }
  const nhomHM = Object.entries(hm).sort((a,b)=>b[1]-a[1]);

  app.innerHTML = `

      </div>

    </div>

    <div class="secs">
      ${nhomHM.length>1?`<div class="sec"><h3>Theo hạng mục</h3><div class="kv">${nhomHM.map(([k,v])=>
        `<div class="r"><span class="k">${esc(k)}</span>
         <span class="v num">${money(v)}</span></div>`).join("")}</div></div>`:""}

        ${items.length ? `<div class="kv">${items.map(e=>
          `<button class="mrow" data-e="${esc(e.id)}">
            <span style="flex:1;min-width:0">
              <span style="display:block;font-weight:600;font-size:14px">${esc(e.hangMuc||"Chưa đặt tên")}</span>
              <span style="display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px">
                ${e.ngay?dmy(e.ngay):"—"}${e.xe?` · ${esc(e.xe)}`:""}${e.ghiChu?` · ${esc(e.ghiChu)}`:""}</span>
            </span>

      </div>

    <div style="height:24px"></div>`;

  document.getElementById("ePrev").onclick = ()=>{ EXP_M = shiftMonth(M,-1); renderExp(); };

  if(nx && !nx.disabled) nx.onclick = ()=>{ EXP_M = shiftMonth(M,1); renderExp(); };

function expForm(M, e){
  const laMoi = !e;
  const mucCu = hangMucDaDung();
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `
    <header class="bar"><button class="iconbtn" id="x">✕</button>
      <h1>${laMoi?"Thêm khoản chi":"Sửa khoản chi"}<span class="sub">Tháng ${+M.slice(5)}/${M.slice(0,4)}</span></h1></header>
    <div class="f">
      <div class="fg"><label>Hạng mục *</label>
        <input id="exHm" list="exHmList" value="${esc(e?.hangMuc||"")}" placeholder="Bảo dưỡng, xăng, bảo hiểm…">
        <datalist id="exHmList">${mucCu.map(m=>`<option value="${esc(m)}">`).join("")}</datalist>
        <div class="hint">Gõ tên mới hoặc chọn hạng mục đã dùng lần trước.</div></div>

      <div class="fg"><label>Thành tiền (VNĐ) *</label>
        <input id="exTien" type="number" inputmode="numeric" value="${e?.soTien??""}"></div>

      <div class="fg"><label>Ngày chi</label>
        ${dateField("exNgay", e?.ngay || M+"-01")}</div>

      <div class="fg"><label>Xe (nếu khoản này của riêng một xe)</label>
        <select id="exXe">
          <option value="">— Chi chung, không của xe nào —</option>
          ${VEHICLES.map(v=>`<option value="${esc(v.id)}" ${e?.xe===v.id?"selected":""}>${esc(v.id)} — ${esc(v.hangXe||"")}</option>`).join("")}
        </select></div>

      <div class="fg"><label>Ghi chú</label>
        <textarea id="exGc" placeholder="Thay nhớt, lọc gió…">${esc(e?.ghiChu||"")}</textarea></div>

      <button class="btn" id="exSave">${laMoi?"Thêm khoản chi":"Lưu thay đổi"}</button>
      ${laMoi?"":`<div style="height:10px"></div>
        <button class="btn danger" id="exDel">Xoá khoản này</button>`}
    </div>`;
  document.body.appendChild(el);
  wireDates(el);
  el.querySelector("#x").onclick = ()=>el.remove();

  const btn = el.querySelector("#exSave");
  btn.onclick = async()=>{
    const hangMuc = el.querySelector("#exHm").value.trim();
    const soTien  = el.querySelector("#exTien").value;
    if(!hangMuc) return alert("Nhập hạng mục đã.");
    if(soTien === "") return alert("Nhập thành tiền đã.");
    const ngayRaw = el.querySelector("#exNgay").value.trim();
    if(ngayRaw && !toISO(ngayRaw))
      return alert("Ngày chi chưa đúng. Định dạng dd/mm/yyyy, ví dụ 05/08/2026.");
    const nhan = btn.textContent;
    btn.textContent = "Đang lưu…"; btn.disabled = true;
    try{
      await saveExpense(M, {
        id: e?.id || newId(),
        hangMuc, soTien: +soTien,
        ngay: toISO(el.querySelector("#exNgay").value),
        xe: el.querySelector("#exXe").value,
        ghiChu: el.querySelector("#exGc").value.trim()
      });
      el.remove(); renderExp();
    }catch(err){
      btn.textContent = nhan; btn.disabled = false;
      alert(loiFirestore(err));
    }
  };

  const del = el.querySelector("#exDel");
  if(del) del.onclick = async()=>{
    if(!confirm(`Xoá khoản "${e.hangMuc}" ${money(e.soTien)} đ?`)) return;
    try{
      await removeExpense(M, e.id);
      el.remove(); renderExp();
    }catch(err){
      alert(String(err.message||"").startsWith("NGAY_SAI")
        ? "Ngày nhập chưa đúng. Định dạng phải là dd/mm/yyyy, ví dụ 05/08/2026."
        : loiFirestore(err));
    }
  };
}

function docRow(v, D){
  if(naDoc(v,D.key))
    return `<div class="r"><span class="k">${D.label}</span>
      <span class="v" style="color:var(--ink-3);font-weight:400">Không áp dụng</span></div>`;
  const d = daysLeft(v[D.key]);
  const s = docState(d);
  const txt = d===null ? "⚠ Chưa nhập" : d<0 ? `Quá hạn ${Math.abs(d)} ngày` : `Còn ${d} ngày`;
  const cls = s.cls==="bad" ? "neg" : s.cls==="warn" ? "wr" : s.cls==="ok" ? "pos" : "wr";
  return `<div class="r"><span class="k">${D.label}</span>
    <span class="v"><span class="${cls}">${txt}</span>
    <span style="display:block;font-size:11.5px;color:var(--ink-3);font-weight:400">
      ${v[D.key]?`hết hạn ${dmy(v[D.key])}`:""}${v[D.newKey]?` · gia hạn ${dmy(v[D.newKey])}`:""}</span></span></div>`;
}

/* ---------- Tự cập nhật khi có bản mới ----------
   Không dựa vào số version nữa. App tự so dấu vân tay của index.html
   trên máy chủ (ETag / Last-Modified) với lúc mở app. Khác nhau = có bản mới. */
let BASE_SIG = null;
let updating = false;

async function fileSig(){
  const url = "index.html?_=" + Date.now();
  try{
    const r = await fetch(url, { method:"HEAD", cache:"no-store" });
    const sig = r.headers.get("etag") || r.headers.get("last-modified");
    if(sig) return sig;
  }catch{}
  try{                                   // máy chủ không trả header -> băm nội dung
    const r = await fetch(url, { cache:"no-store" });
    const t = await r.text();
    let h = 0;
    for(let i=0;i<t.length;i++) h = (Math.imul(h,31) + t.charCodeAt(i))|0;
    return "h" + h;
  }catch{}
  return null;
}

async function checkUpdate(){
  if(updating) return;
  const sig = await fileSig();
  if(!sig) return;
  if(BASE_SIG === null){ BASE_SIG = sig; return; }   // lần đầu chỉ ghi nhận
  if(sig !== BASE_SIG) showUpdateBar(null);
}

async function applyUpdate(worker){
  updating = true;
  if(worker){ worker.postMessage({ type:"SKIP_WAITING" }); return; }
  try{
    if("caches" in window){
      const ks = await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
    const reg = await navigator.serviceWorker?.getRegistration();
    if(reg) await reg.update();
  }catch{}
  location.reload();
}

function showUpdateBar(worker){
  if(document.getElementById("upbar")) return;
  const bar = document.createElement("div");
  bar.id = "upbar";
  bar.innerHTML = `<span class="t"><b>Đã có bản mới</b><span>Cập nhật để dùng tính năng mới nhất</span></span>
    <button class="later" id="upLater">Để sau</button>
    <button id="upNow">Cập nhật</button>`;
  document.body.appendChild(bar);
  bar.querySelector("#upLater").onclick = ()=>bar.remove();
  bar.querySelector("#upNow").onclick = ()=>{
    bar.querySelector("#upNow").textContent = "Đang tải…";
    applyUpdate(worker);
  };
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    // đã có bản chờ sẵn từ lần trước
    if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);

    reg.addEventListener("updatefound", ()=>{
      const nw = reg.installing;
      if(!nw) return;
      nw.addEventListener("statechange", ()=>{
        // có controller = đây là bản cập nhật, không phải cài lần đầu
        if(nw.state==="installed" && navigator.serviceWorker.controller) showUpdateBar(nw);
      });
    });

    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
  }).catch(()=>{});

  // service worker mới nắm quyền -> nạp lại trang 1 lần
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });
}
